<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#F4FAF8" />

    <title>Tidence — Web design and development studio</title>
    <meta
      name="description"
      content="Tidence is a digital studio building websites, CRMs, office automation and the everyday tools a business runs on."
    />

    <link rel="canonical" href="__SITE_URL__/" />
    <!-- hreflang alternates for /en and /es, filled in by scripts/prerender.mjs. -->
    <!--alternates-->
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tidence" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Tidence — Web design and development studio" />
    <meta
      property="og:description"
      content="A digital studio building websites, CRMs, office automation and the everyday tools a business runs on."
    />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:alt" content="The tidence wordmark with the anchor mark rebuilt from teal and sand cubes" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tidence — Web design and development studio" />
    <meta
      name="twitter:description"
      content="A digital studio building websites, CRMs, office automation and the everyday tools a business runs on."
    />
    <meta name="twitter:image" content="__SITE_URL__/og.jpg" />

    <!-- The brand's primary icon (brand/icon-gradient), in every form browsers,
         search engines and phones look for. Google wants a square size that is
         a multiple of 48px at a stable URL, and asks /favicon.ico first. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts are self-hosted (src/fonts, declared in src/fonts.css). Only the
         faces the first screen uses are preloaded. -->
    <link rel="preload" as="font" type="font/woff2" href="/src/fonts/bricolage.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/fonts/dm-mono-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/fonts/newsreader-italic-display.woff2" crossorigin />

    <!-- Filled in per page by scripts/prerender.mjs. -->
    <!--jsonld-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

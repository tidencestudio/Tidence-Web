<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F1E24" />

    <title>Tidence — Web design and development studio</title>
    <meta
      name="description"
      content="Tidence is a digital studio building websites, CRMs, office automation and the everyday tools a business runs on."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tidence — Web design and development studio" />
    <meta
      property="og:description"
      content="A digital studio building websites, CRMs, office automation and the everyday tools a business runs on."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fanwood+Text:ital@0;1&family=Goudy+Bookletter+1911&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- The hero image is the LCP element on every viewport. -->
    <link rel="preload" as="image" href="/wave-sunset.jpg" fetchpriority="high" />
  </head>
  <body>
    <!-- Runs before first paint so the page never renders in the wrong
         language and flips. This is the only inline script on the page. -->
    <script>
      (function () {
        var root = document.documentElement;
        try {
          var lang = localStorage.getItem('tidence-lang');
          if (lang !== 'en' && lang !== 'es') {
            var wanted = navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language || 'en'];
            lang = 'en';
            for (var i = 0; i < wanted.length; i++) {
              var base = String(wanted[i]).toLowerCase().split('-')[0];
              if (base === 'en' || base === 'es') { lang = base; break; }
            }
          }
          root.lang = lang;
        } catch (e) {
          // Private mode can throw on localStorage.
          root.lang = 'en';
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
